---
- name: Common setup on all hosts
  hosts: all
  become: yes
  strategy: free
  tasks:

    - name: Wait for cloud-init
      command: cloud-init status --wait
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Install common packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-flask
        state: present
        lock_timeout: 300


- name: Configure service nodes
  hosts: nodes
  become: yes
  strategy: free
  tasks:

    - name: Install snmpd
      apt:
        name: snmpd
        state: present
        lock_timeout: 300

    - name: Copy service.py
      copy:
        src: service.py
        dest: /home/ubuntu/service.py
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      notify: restart service-py

    - name: Create systemd service for service.py
      copy:
        dest: /etc/systemd/system/service-py.service
        content: |
          [Unit]
          Description=Flask service
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu
          Environment=FLASK_APP=service.py
          ExecStart=/usr/bin/python3 -m flask run --host=0.0.0.0 --port=5000
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: restart service-py

    - name: Enable service-py
      systemd:
        name: service-py
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Configure snmpd listen address
      lineinfile:
        path: /etc/snmp/snmpd.conf
        regexp: '^agentAddress'
        line: 'agentAddress udp:{{ ansible_default_ipv4.address }}:161'
      notify: restart snmpd

    - name: Configure SNMP community
      lineinfile:
        path: /etc/snmp/snmpd.conf
        regexp: '^rocommunity'
        line: 'rocommunity public 192.168.100.0/24'
      notify: restart snmpd

    - name: Enable snmpd
      systemd:
        name: snmpd
        enabled: yes
        state: started

  handlers:
    - name: restart service-py
      systemd:
        name: service-py
        state: restarted
        daemon_reload: yes

    - name: restart snmpd
      systemd:
        name: snmpd
        state: restarted


- name: Configure bastion
  hosts: bastion
  become: yes
  strategy: free
  tasks:

    - name: Install iputils-ping
      apt:
        name: iputils-ping
        state: present
        lock_timeout: 300

    # pip3 on Ubuntu 22.04+ refuses to install into the system python
    # without this flag
    - name: Install ping3
      pip:
        name: ping3

    - name: Copy alive.py
      copy:
        src: alive.py
        dest: /home/ubuntu/alive.py
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      notify: restart alive

    - name: Create systemd service for alive.py
      copy:
        dest: /etc/systemd/system/alive.service
        content: |
          [Unit]
          Description=Node availability checker
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu
          Environment=FLASK_APP=alive.py
          ExecStart=/usr/bin/python3 -m flask run --host=0.0.0.0 --port=5001
          Restart=on-failure
          AmbientCapabilities=CAP_NET_RAW

          [Install]
          WantedBy=multi-user.target
      notify: restart alive

    - name: Enable alive
      systemd:
        name: alive
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: restart alive
      systemd:
        name: alive
        state: restarted
        daemon_reload: yes


- name: Configure proxy
  hosts: proxy
  become: yes
  strategy: free
  tasks:

    - name: Install proxy services
      apt:
        name:
          - haproxy
          - nginx-full
        state: present
        lock_timeout: 300

    - name: Write HAProxy config
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
      notify: restart haproxy

    - name: Enable HAProxy
      systemd:
        name: haproxy
        enabled: yes
        state: started

    - name: Write Nginx UDP stream config
      template:
        src: nginx_snmp.conf.j2
        dest: /etc/nginx/stream.conf
      notify: restart nginx

    # stream {} block must come before the http {} block in nginx.conf
    - name: Make sure nginx.conf includes the stream config
      lineinfile:
        path: /etc/nginx/nginx.conf
        line: 'include /etc/nginx/stream.conf;'
        insertbefore: '^http'
      notify: restart nginx

    - name: Enable Nginx
      systemd:
        name: nginx
        enabled: yes
        state: started

  handlers:
    - name: restart haproxy
      systemd:
        name: haproxy
        state: restarted

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
